headline = "Daylen Everette breaks up two passes as Steelers beat Colts 34-22"
dek = "IMG Academy defensive backs kept getting hands on the ball: DJ Turner II broke up one pass in a win at Miami, and Grant Delpit had one against the Jets."
lead = "Daylen Everette made Daniel Jones work for everything in Pittsburgh's 34-22 win over Indianapolis. The cornerback broke up two throws and made five solo tackles. One sequence late in the second quarter told the story: he got a hand on a pass, then on the next snap held a third-down completion to a single yard. He stayed on the field for 67 defensive snaps and six more on special teams. Fifteen IMG Academy alumni played this week."
alternates = ["Everette's two pass breakups help Steelers top Colts, 34-22", "Steelers corner Daylen Everette stars in 34-22 win over Colts"]

