headline = "Jihaad Campbell makes 6 solo tackles as Eagles edge Titans 24-20"
dek = "A big week for IMG Academy defenders: Nolan Smith added a sack in the same win, and Grant Delpit had one of his own at Tampa Bay."
lead = "Jihaad Campbell kept showing up in Philadelphia's 24-20 road win at Tennessee, finishing with 6 solo tackles and 4 assists in 47 defensive snaps. On the other side of that game, Carnell Tate caught 3 of 5 targets for 27 yards for the Titans. Fifteen IMG Academy alumni played in Week 2."
