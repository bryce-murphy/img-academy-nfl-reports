headline = "Jihaad Campbell makes 6 solo tackles as Eagles edge Titans 24-20"
dek = "A big week for IMG Academy defenders: Nolan Smith added a sack in the same win, and Grant Delpit had one of his own at Tampa Bay."
lead = "Jihaad Campbell kept showing up in Philadelphia's 24-20 road win at Tennessee, finishing with 6 solo tackles and 4 assists in 47 defensive snaps. Fellow Eagle Nolan Smith added a sack, and Grant Delpit had one of his own in Cleveland's 23-19 win at Tampa Bay. On the other side of the Eagles game, Carnell Tate caught 3 of 5 targets for 27 yards for Tennessee. In all, 15 alumni played this week."
alternates = ["Campbell and Nolan Smith help Eagles take down Titans 24-20", "15 alumni see the field as 5 of their 12 teams win in week 2"]
