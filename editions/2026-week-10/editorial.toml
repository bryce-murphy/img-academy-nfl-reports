lead = "J.J. McCarthy threw for 293 yards against Washington, and his 66-yard touchdown to Likely in the fourth quarter was the Giants' biggest play of the day. It still wasn't enough. An interception, plus a third-quarter fumble by Nabers after a short completion, cost New York chances in a 24-21 loss. Teammates Greg Newsome II, with three solo tackles, and Francis Mauigoa, at tackle, shared the afternoon with him. Thirteen IMG Academy alumni played this week."
