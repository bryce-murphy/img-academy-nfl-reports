headline = "Carnell Tate catches 9 for 145 yards in Titans' loss at Baltimore"
dek = "Interceptions in wins for IMG Academy defensive backs: Greg Newsome II also broke up 3 passes, and Grant Delpit's late pick sealed Cleveland's win."
lead = "Carnell Tate was Cam Ward's most reliable option in Baltimore, turning 12 targets into 9 catches and 145 yards. His biggest grab came late, a 33-yard catch down the left side that put Tennessee at the Baltimore 3 with 1:51 left. It wasn't enough. The Titans fell 24-18, with fellow IMG Academy alum JC Latham at tackle for 64 snaps. Fifteen IMG Academy alumni played this week."
