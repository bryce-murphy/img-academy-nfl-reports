headline = "DJ Turner II forces two fumbles as Bengals outlast Titans 43-36"
dek = "Nolan Smith had the lone alumni sack in a 27-10 loss at Washington, and Hjalte Froholdt played 81 snaps at center as Arizona edged Dallas."
lead = "DJ Turner II kept swiping at the ball until it came loose. The Bengals cornerback jarred a short completion free in the second quarter, and Cincinnati recovered at its own 32. He forced another fumble in the fourth, though Tennessee fell on that one. In a 43-36 shootout, with fellow alum JC Latham at tackle for the Titans, those chances counted. Turner logged 58 defensive snaps and two solo tackles. Eleven IMG Academy alumni played this week."
alternates = ["Nolan Smith records a sack, but Eagles fall 27-10 in Washington", "Hjalte Froholdt anchors Cardinals in 33-30 win over Dallas"]
