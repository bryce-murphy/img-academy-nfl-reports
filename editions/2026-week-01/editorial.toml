headline = "Jihaad Campbell sacks Daniels as Eagles edge Commanders 24-22"
dek = "IMG Academy alumni kept meeting across the line: Andre Cisco made 6 solo tackles in the Jets' win at Tennessee, where Carnell Tate caught 4 passes."
lead = "Jihaad Campbell never left the field for long in Philadelphia's 24-22 win over Washington. The linebacker logged 67 defensive snaps, and it showed: five solo tackles, four assists and a fourth-quarter sack of Daniels in a game that stayed tight to the finish. He also stopped a second-quarter run on third down, getting the defense off the field. Fellow alum Nolan Smith worked beside him, while Kaytron Allen carried for the Commanders. Fifteen IMG Academy alumni played this week."
alternates = ["Eagles hold off Commanders 24-22 behind Jihaad Campbell's sack", "Andre Cisco makes 6 solo tackles as Jets beat Titans 23-10"]
