headline = "J.J. McCarthy throws for 252 yards as Giants win 27-21 at Houston"
dek = "IMG Academy alumni shared a field in Tennessee: Grant Delpit made 5 solo tackles in a Browns win, and Carnell Tate caught 5 passes for the Titans."
lead = "J.J. McCarthy did his damage early in Houston. Two first-quarter throws, a 47-yarder to M. Fields and a 42-yarder to M. Nabers that reached the Texans' 2, flipped the field and put the Giants on the front foot in a 27-21 road win. Fellow IMG Academy alum Francis Mauigoa was on the line in front of him for 66 offensive snaps. Across the league, 13 IMG Academy alumni played this week."
alternates = ["Grant Delpit makes 5 solo tackles as Browns edge Titans 27-24", "Giants win 27-21 at Houston behind J.J. McCarthy's 252 yards"]

