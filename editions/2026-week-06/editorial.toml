headline = "Carnell Tate catches touchdown as Titans win 26-20 at Indianapolis"
dek = "Road wins carried the week: Daylen Everette picked off a fourth-quarter pass in Pittsburgh's win at Tampa Bay, and Hjalte Froholdt played 72 snaps in Arizona's."
lead = "Carnell Tate kept finding space in Indianapolis. Ward looked his way seven times, and Tate caught six of them for 70 yards. The last was an 8-yard touchdown early in the fourth quarter that helped the Titans close out a 26-20 road win. He also opened the second half with a 19-yard catch down the right side. Fellow IMG Academy alumnus JC Latham played 46 snaps up front in the same win. Fifteen IMG Academy alumni played this week."
alternates = ["Carnell Tate's 6 catches power Titans past the Colts, 26-20", "Daylen Everette's interception helps Steelers win at Tampa Bay"]

