name: Build report
on:
  workflow_dispatch:
    inputs:
      season:
        description: NFL season year (blank for current)
        type: string
        default: ''
      week:
        description: Week (blank for latest complete reporting window)
        type: string
        default: ''
      historical:
        description: Historical replay (relax source age, retain accuracy checks)
        type: boolean
        default: false
      refresh_roster:
        description: Generate a roster review instead of a report
        type: boolean
        default: false
  schedule:
    - cron: '0 9 * 9-12,1-2 3'
      timezone: America/New_York
permissions:
  contents: read
concurrency:
  group: report-build
  cancel-in-progress: false
jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate code before reading feeds
        run: python -m unittest discover -s tests
      - name: Fetch and build
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
          HISTORICAL: ${{ inputs.historical }}
          REFRESH_ROSTER: ${{ inputs.refresh_roster }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          args = [sys.executable, '-m', 'src.report']
          for key, flag in [('INPUT_SEASON', '--season'), ('INPUT_WEEK', '--week')]:
              value = os.environ.get(key, '')
              if value:
                  if not value.isdigit():
                      raise SystemExit('Season and week must contain digits only')
                  args += [flag, value]
          if os.environ['EVENT_NAME'] == 'schedule': args += ['--scheduled']
          if os.environ.get('HISTORICAL') == 'true': args += ['--historical']
          if os.environ.get('REFRESH_ROSTER') == 'true': args += ['--refresh-roster']
          subprocess.run(args, check=True)
          PY
      - name: Save report and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: report-${{ github.run_id }}
          path: |
            site/reports/
            build/roster-review.json
            .cache/manifest.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
